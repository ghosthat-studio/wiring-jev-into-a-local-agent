[project]
name = "inbox-agent-jev-gate"
version = "0.1.0"
description = "Companion code for Old Nain 001: wiring Jev into a local email agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_agent"]
